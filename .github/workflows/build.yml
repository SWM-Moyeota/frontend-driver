name: 빌드 테스트

on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'presentation/**'
      - 'domain/**'
      - 'data/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :app:assembleDebug :data:testDebugUnitTest --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: data/build/reports/tests/testDebugUnitTest
          retention-days: 7
